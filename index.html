<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" /> <!--для использования русских букв-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!--адаптация под телефоны/планшеты-->
    <title>Посмотри в окно</title> <!--название вкладки-->
    <link rel="stylesheet" href="./fonts/fonts.css" /> <!--подключение стилей, шрифтов и т.д.-->
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/preloader.css" />
    <link rel="stylesheet" href="./styles/error.css" />
  </head>
  <body class="page">
    <main class="content">
      <section class="result">

        <div class="result__video-container">
          <video src="" controls class="result__video" poster=""></video> <!--место для видео; controls добавляет play/pause, громкость; картинка для отображения до запуска видео-->
        </div>

        <form class="search-form"> <!--форма для поиска города-->
          <fieldset class="search-form__fieldset">
            <h2 class="search-form__fieldset-title">Город</h2>
            <label class="search-form__label">
              <span class="search-form__label-text visually-hidden">Город</span>
              <input
                type="text" 
                placeholder="Санкт Петербург, например"
                name="city"
                class="search-form__textfield"
              /> <!--поля для ввода текста и пример текста-->
            </label>
          </fieldset>

          <fieldset class="search-form__fieldset"> <!--фильтр времени суток-->
            <h2 class="search-form__fieldset-title">Время суток</h2>
            <div class="search-form__checkbox-list">
              <label class="search-form__label">
                <input
                  type="checkbox"
                  name="time"
                  value="morning"
                  class="search-form__checkbox visually-hidden"
                /> <!--фильтр утро-->
                <span class="search-form__pseudo-checkbox"></span> <!--кастомный чекбокс (css)-->
                <span class="search-form__label-text">Утро</span> <!--кастомный текст (css)-->
              </label>
              <label class="search-form__label">
                <input
                  type="checkbox"
                  name="time"
                  value="afternoon"
                  class="search-form__checkbox visually-hidden"
                /> <!--фильтр день-->
                <span class="search-form__pseudo-checkbox"></span> 
                <span class="search-form__label-text">День</span>
              </label>
              <label class="search-form__label">
                <input
                  type="checkbox"
                  name="time"
                  value="night"
                  class="search-form__checkbox visually-hidden"
                /> <!--фильтр ночь-->
                <span class="search-form__pseudo-checkbox"></span>
                <span class="search-form__label-text">Ночь</span>
              </label>
            </div>
          </fieldset>
          <button type="submit" class="button search-form__submit-button">
            Найти
          </button>
        </form>
      </section>
      
      <section class="content__details">
        <h1 class="title">
          <span class="content__accent">По-</span><br />смотри<br />в окно
        </h1> <!--главный заголовок страницы; По- будет другого цвета; br / перенос строки-->
        <ul class="content__list">
          <!--JavaScript будет вставлять карточки с видео-->
        </ul>
      </section> 
    </main>

    <!-- ТЕМПЛЕЙТЫ -->

    <template class="preloader-template"> <!--шаблон загрузки (4 квадрата)-->
      <div class="preloader">
        <div class="preloader-chasing-squares">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>
      </div>
    </template>

    <template class="cards-list-item-template"> <!--шаблон карточки видео-->
      <li class="content__list-item">
        <a href="#0" class="content__card-link">
          <article class="content__video-card">
            <div class="content__video-card-description-container">
              <h2 class="content__video-card-title"></h2> <!--заголовок видео-->
              <p class="content__video-card-description"></p> <!--описание видео-->
            </div>
            <img src="" alt="" class="content__video-card-thumbnail" /> <!--превью видео-->
          </article>
        </a>
      </li>
    </template>
    
    <template class="more-button-template"> <!--шаблок кнопки для загрузки доп видео-->
      <li><button class="button more-button">Показать еще</button></li>
    </template>

    <template class="error-template"> <!--шаблон ошибки (например, если видео не найдено)-->
      <div class="error">
        <h2 class="error__title"></h2>
      </div>
    </template>
    <script src="./scripts/script.js"></script> <!--подключение JavaScript (обработка поиска, загрузка видео, вставка шаблонов, показ прелоудеров и ошибок)-->
  </body>
</html>
